
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Bootstrap Web App</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container py-5">
        <h1 class="text-primary text-center">
            Welcome to My Bootstrap Web App
        </h1>

        <p class="lead text-center">
            A web application created using the Bootstrap framework.
        </p>

        <!-- About My App -->
        <section class="card mt-4 mx-auto" style="max-width: 500px;">
            <div class="card-body text-center">
                <h2 class="card-title">About My App</h2>
                <p class="card-text">
                    I am learning how to build responsive web applications
                    using HTML, CSS, JavaScript and Bootstrap.
                </p>
                <button class="btn btn-primary" type="button">
                    Explore My Learning
                </button>
            </div>
        </section>

        <!-- Random Fact Generator -->
        <section class="card mt-4 mx-auto" style="max-width: 500px;">
            <div class="card-body text-center">
                <h2 class="card-title">Random Fact Generator</h2>
                <p class="card-text">
                    Click the button to discover a random fact.
                </p>

                <button
                    type="button"
                    class="btn btn-success"
                    id="factButton"
                >
                    Show Me a Fact
                </button>

                <div
                    id="factResult"
                    class="alert alert-info mt-3"
                    role="status"
                    aria-live="polite"
                    hidden
                ></div>
            </div>
        </section>

        <!-- Contact Form -->
        <section class="card mt-4 mx-auto" style="max-width: 500px;">
            <div class="card-body">
                <h2 class="card-title text-center">Contact Me</h2>

                <form id="contactForm">
                    <div class="mb-3">
                        <label for="name" class="form-label">
                            Your Name
                        </label>
                        <input
                            type="text"
                            class="form-control"
                            id="name"
                            name="name"
                            placeholder="Enter your name"
                            autocomplete="name"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">
                            Email Address
                        </label>
                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="message" class="form-label">
                            Message
                        </label>
                        <textarea
                            class="form-control"
                            id="message"
                            name="message"
                            rows="3"
                            placeholder="Write your message"
                            required
                        ></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Send Message
                    </button>

                    <p
                        id="formMessage"
                        class="alert alert-success mt-3"
                        role="status"
                        aria-live="polite"
                        hidden
                    ></p>
                </form>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
